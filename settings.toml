# settings.toml — configuration for the NTP clock
#
# Copy this file to the root of the CIRCUITPY drive.
# Edit the values below to match your environment.

# WiFi credentials
WIFI_SSID     = "your_ssid_here"
WIFI_PASSWORD = "your_password_here"

# Primary NTP server hostname
NTP_SERVER = "time.nist.gov"

# Fallback NTP server — used automatically after repeated primary failures.
# Switching back to primary happens silently when it recovers.
NTP_SERVER_FALLBACK = "pool.ntp.org"

# How often to sync with NTP (seconds)
NTP_SYNC_INTERVAL = "3600"

# Random fuzz applied to the sync interval, as a percentage of the interval.
# The next sync is scheduled at the current interval +/- up to this percentage,
# preventing multiple devices from hitting the server in lockstep (RFC 5905).
# Using a percentage rather than a fixed number of seconds means the fuzz
# scales correctly as the adaptive interval grows or shrinks.
# Set to 0 to disable fuzz.  Default: 10 (10%).
NTP_SYNC_FUZZ_PCT = "10"

# Time format: 24 for 24-hour, 12 for 12-hour
TIME_FORMAT = "24"

# Set to 1 to enable serial debug output (useful when USB is connected)
DEBUG = "0"

# Display brightness for the clock digits (backlight): 0.0 to 1.0
# This is the power-on default. Brightness can be adjusted at runtime
# by holding D2 and using short presses to cycle through five levels.
BRIGHTNESS = "1.0"

# Battery saver timeout in seconds (0 = disabled).
# When running on battery only (no USB), the display dims to minimum
# brightness after this many seconds of button inactivity.
# Any button press restores brightness and resets the timer.
BATTERY_SAVER_TIMEOUT = "60"

# Brightness for the status bar text (Sync, Battery, Ping): 0.0 to 1.0
INFO_BRIGHTNESS = "1.0"

# Startup timezone offset in whole hours from UTC.
# Examples: 0=UTC, -5=UTC-5, 1=UTC+1, -3=UTC-3
# Note: for fractional-hour zones (e.g. UTC+5:30) set the nearest whole hour
# and use the D1 button to fine-tune at runtime.
# D1 button steps through all zones at runtime.
DEFAULT_TZ_OFFSET = "0"
